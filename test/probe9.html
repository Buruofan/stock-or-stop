<!DOCTYPE html>
<html><meta charset="utf-8">
<body style="margin:0">
<iframe id="f" src="../index.html" style="width:390px;height:900px;border:1px solid #ccc"></iframe>
<pre id="r">PENDING</pre>
<script>
const log = [];
const ok = (c, m) => log.push((c ? 'PASS ' : 'FAIL ') + m);
window.onload = () => setTimeout(run, 500);
function run() {
  const frame = document.getElementById('f');
  const d = frame.contentDocument;
  const w = frame.contentWindow;
  if (!d || !w) { document.getElementById('r').textContent = 'FAIL no iframe doc'; return; }
  ok(d.querySelectorAll('#topnav a[data-sec]').length === 4, '顶部导航保留 4 个最终版锚点');
  ok(d.querySelector('.brand .bn').textContent === '囤货算盘', '品牌名为「囤货算盘」');
  ok(d.title.includes('Stock or Stop'), '标题包含英文名 Stock or Stop');
  ['sec-main', 'sec-cmp', 'sec-group', 'sec-about'].forEach(id => ok(!!d.getElementById(id), id + ' 存在'));
  ok(!d.getElementById('sec-vs'), '不再提供独立「预售 vs 现货」模块');
  ok(!!d.querySelector('.split .col-result #k-out'), '结论面板与输入区分列');
  ok(!!d.querySelector('#k-out .dhero'), '结论面板含深色核心结论卡');
  ok(d.querySelectorAll('#sec-about .method-row').length === 6, '计算方法保留 6 条口径');
  const cmpLink = d.querySelector('#topnav a[data-sec="sec-cmp"]');
  cmpLink.click();
  ok(cmpLink.classList.contains('active'), '点击导航后当前项高亮');
  ok(d.getElementById('offers-out').textContent.length > 0, '套装比价已渲染');
  document.getElementById('r').textContent = log.join('\n');
  document.title = log.some(l => l.startsWith('FAIL')) ? 'HASFAIL' : 'ALLPASS';
}
</script></body></html>
